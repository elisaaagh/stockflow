
name: StockFlow CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: PostgreSQL Integration Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: stockflow_test_db
          POSTGRES_USER: stockflow_test
          POSTGRES_PASSWORD: ci_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stockflow_test -d stockflow_test_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Create test configuration
        run: |
          {
            echo "DB_TEST_HOST=localhost"
            echo "DB_TEST_PORT=5432"
            echo "DB_TEST_NAME=stockflow_test_db"
            echo "DB_TEST_USER=stockflow_test"
            echo "DB_TEST_PASSWORD=ci_test_password"
          } > .env.test

      - name: Initialize test database
        env:
          PGPASSWORD: ci_test_password
        run: |
          psql \
            -h localhost \
            -p 5432 \
            -U stockflow_test \
            -d stockflow_test_db \
            -v ON_ERROR_STOP=1 \
            -f database/schema.sql

      - name: Run integration tests
        run: |
          python -m pytest tests/ -v
